name: CI

on:
  push:
    branches: [main, 'paket-*']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} — sintaksa i jedinični testovi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Sintaksa (H0.71)
        run: bin/lint.sh
      - name: Jedinični testovi
        run: composer unit

  static:
    name: PHPCS, PHPStan, čuvari, paket, namjerni kvarovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: PHPCS — WordPress standard i PHPCompatibilityWP (H0.72, H0.76)
        run: composer phpcs
      - name: PHPStan razina 8 (H0.73)
        run: composer phpstan
      - name: Čuvari — nula CSS/JS, nula frontenda, dozvole, tajne (H0.74, H0.75, H0.79)
        run: composer guards
      - name: Paket (H0.78)
        run: bin/build-zip.sh
      - name: Namjerni kvarovi (H0.81–H0.90)
        run: bin/run-faults.sh

  integration:
    name: Integracija — WP ${{ matrix.wp }}, WC ${{ matrix.wc }}, PHP ${{ matrix.php }}${{ matrix.multisite == '1' && ', multisite' || '' }}${{ matrix.without_wc == '1' && ', bez WooCommercea' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wp: '6.4.14', wc: '8.0.3', multisite: '0', without_wc: '0' }
          - { php: '8.3', wp: 'latest', wc: 'latest', multisite: '0', without_wc: '0' }
          - { php: '8.1', wp: '6.4.14', wc: '8.0.3', multisite: '1', without_wc: '0' }
          - { php: '8.3', wp: 'latest', wc: 'latest', multisite: '1', without_wc: '0' }
          - { php: '8.1', wp: '6.4.14', wc: '8.0.3', multisite: '0', without_wc: '1' }
          - { php: '8.3', wp: 'latest', wc: 'latest', multisite: '0', without_wc: '1' }
    services:
      mysql:
        image: mysql:8.0
        env:
          # Lozinka vrijedi samo za privremeni kontejner ovog posla; nije tajna.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2, wp-cli
      - run: composer install --no-interaction --no-progress
      - name: WordPress, WooCommerce i wp-phpunit
        run: bin/ci-prepare-wp.sh "${{ matrix.wp }}" "${{ matrix.wc }}"
      - name: Provjera pripreme (konfiguracija, baza, datoteke)
        env:
          WP_PHPUNIT__TESTS_CONFIG: /tmp/wordpress/wp-tests-config.php
        run: bin/ci-check-prepared.sh
      - name: Integracijski testovi (H0.77)
        env:
          # wp-phpunit čita putanju konfiguracije iz ove varijable (ne iz WP_TESTS_CONFIG_FILE_PATH).
          WP_PHPUNIT__TESTS_CONFIG: /tmp/wordpress/wp-tests-config.php
          WP_MULTISITE: ${{ matrix.multisite }}
          BBH_WITHOUT_WC: ${{ matrix.without_wc }}
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist
